name: daily-taxcase

# 每日定时任务：
#   07:00 数据质检 + 确定性自动修复 + 重建看板（自动提交），并建一条 Issue 同步结果、@负责人邮件提醒
#   采集（找新案例）依赖 coze-coding-ai 搜索能力，GitHub runner 无此工具，故不设定时；
#   如需采集请在有搜索能力的环境手动触发 workflow_dispatch(task=collect/all)，或由维护者在会话中采集。
# 也支持在 Actions 页面手动点 "Run workflow" 立即执行。
#
# 注意：cron 用 UTC 时间。北京时间（UTC+8）07:00 = UTC 23:00（前一天）。
on:
  schedule:
    - cron: "0 23 * * *"   # 北京时间 07:00 质检 + 自动修复 + 重建 + 结果同步
  workflow_dispatch:
    inputs:
      task:
        description: "手动执行：collect=采集 / lint=质检 / all=两者"
        required: true
        default: "lint"
        type: choice
        options: [lint, collect, all]

permissions:
  contents: write   # 允许 lint 自动提交修复后的 index.html / analysis.html
  issues: write     # 允许每天建一条质检结果 Issue（@负责人触发邮件提醒）

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # 采集依赖 coze-coding-ai 搜索 CLI；CI 环境若无该 CLI/鉴权则自动跳过采集（质检不受影响）。
      - name: 检查搜索 CLI
        id: cli
        run: |
          if command -v coze-coding-ai >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未检测到 coze-coding-ai，采集步骤将跳过（质检仍会执行）"
          fi

      # 05:00 采集（调度触发）或手动选 collect/all
      - name: 每日采集候选
        if: >-
          (github.event_name == 'schedule' && github.event.schedule == '0 21 * * *')
          || (github.event_name == 'workflow_dispatch' && (inputs.task == 'collect' || inputs.task == 'all'))
        env:
          HAS_CLI: ${{ steps.cli.outputs.available }}
        run: |
          if [ "$HAS_CLI" != "true" ]; then echo "跳过采集：无 coze-coding-ai CLI"; exit 0; fi
          bash scripts/run-daily-tasks.sh collect

      # 07:00 质检+修复+重建（定时触发）或手动选 lint/all。即使发现需人工处理项（退出码1），也继续往下走到“结果同步”步骤。
      - name: 数据质检 + 自动修复 + 重建看板
        id: lint
        if: >-
          github.event_name == 'schedule'
          || (github.event_name == 'workflow_dispatch' && (inputs.task == 'lint' || inputs.task == 'all'))
        continue-on-error: true
        run: |
          mkdir -p reports
          bash scripts/run-daily-tasks.sh lint 2>&1 | tee reports/lint-$(date +%Y-%m-%d).log

      # 上传采集候选报告为构建产物，供人工下载确认
      - name: 上传候选报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collect-reports
          path: reports/
          if-no-files-found: ignore

      # lint 的确定性修复 + 重建结果自动提交回仓库（仅数据文件；采集报告 reports/ 走 artifact 不入库；无改动则跳过）
      - name: 提交质检修复结果
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "taxcase-bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html analysis.html
          if git diff --cached --quiet; then
            echo "无修复/重建改动，跳过提交"
          else
            git commit -m "chore(lint): 每日数据质检自动修复 + 重建看板 [skip ci]"
            git push
          fi

      # 每天把质检结果建一条 Issue 并 @负责人（自动触发邮件/通知），无需手动翻 Actions 日志
      - name: 同步质检结果（Issue @负责人）
        if: >-
          always()
          && (github.event_name == 'schedule'
              || (github.event_name == 'workflow_dispatch' && (inputs.task == 'lint' || inputs.task == 'all')))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          LOG=$(ls -t reports/lint-*.log 2>/dev/null | head -1)
          [ -z "$LOG" ] && LOG="reports/lint-$(date +%Y-%m-%d).log"
          ERR=$(grep -oE "需人工处理 *error[：: ]+[0-9]+" "$LOG" 2>/dev/null | grep -oE "[0-9]+" | head -1); ERR=${ERR:-0}
          FIX=$(grep -oE "可自动修复项[：: ]+[0-9]+" "$LOG" 2>/dev/null | grep -oE "[0-9]+" | head -1); FIX=${FIX:-0}
          TOTAL=$(grep -oE "案例总数[：: ]+[0-9]+" "$LOG" 2>/dev/null | grep -oE "[0-9]+" | head -1)
          DATE=$(date +%Y-%m-%d)
          LOGTAIL=$(tail -60 "$LOG" 2>/dev/null)
          BODY=$(printf '@Xumx123 每日数据质检已完成（北京时间 %s 早 7 点）。\n\n- 案例总数：%s 条\n- 自动修复（地区/代码/企业性质/日期/样式等格式问题）：%s 项\n- 需人工处理的异常（缺字段/疑似重复/分类存疑/金额异常）：%s 项\n- 看板 analysis.html：已按最新数据重建\n\n<details><summary>质检完整日志（点开展开）</summary>\n\n```\n%s\n```\n\n</details>\n\n> 说明：GitHub 无搜索工具，新案例采集/案件进展复查需由维护者在有搜索能力的环境执行。\n' "$DATE" "${TOTAL:-?}" "$FIX" "$ERR" "$LOGTAIL")
          if [ "$ERR" -gt 0 ]; then
            TITLE="⚠️ 每日质检 $DATE：发现 $ERR 项需人工处理"
            LABELS="lint-report,needs-attention"
          else
            TITLE="✅ 每日质检 $DATE：通过，自动修复 $FIX 项"
            LABELS="lint-report"
          fi
          gh label create lint-report --color "0E8A16" --description "每日数据质检结果" 2>/dev/null || true
          gh label create needs-attention --color "D93F0B" --description "质检发现需人工处理项" 2>/dev/null || true
          gh issue create --title "$TITLE" --label "$LABELS" --body "$BODY"
          echo "已创建质检结果 Issue：$TITLE"
